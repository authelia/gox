name: build

on:
  push: {}

env:
  GOPATH: /home/runner/work/go

permissions:
  contents: read

jobs:
  test-after-go-11:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [
          "1.11.13",
          "1.12.17",
          "1.13.15",
          "1.14.15",
          "1.15.15",
          "1.16.15",
          "1.17.13",
          "1.18.10",
          "1.19.13",
          "1.20.14",
          "1.21.13",
          "1.22.12",
          "1.23.12",
          "1.24.6",
          "1.25.0",
        ]
      fail-fast: true

    name: Go ${{ matrix.go }} test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Setup go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build .
      - name: Test
        run: go test -v ./...
  test-before-go-11:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [
          "1.6.4",
          "1.7.6",
          "1.8.7",
          "1.9.7",
          "1.10.8",
        ]
      fail-fast: true

    name: Go ${{ matrix.go }} test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Setup go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version: ${{ matrix.go }}
      - name: Setup GOPATH
        run: mkdir -p $GOPATH/src/github.com/$GITHUB_REPOSITORY
      - name: Copy
        run: cp -r ./ $GOPATH/src/github.com/$GITHUB_REPOSITORY
      - name: Get
        run: cd $GOPATH/src/github.com/$GITHUB_REPOSITORY && go get .
      - name: Build
        run: cd $GOPATH/src/github.com/$GITHUB_REPOSITORY && go build .
      - name: Test
        run: cd $GOPATH/src/github.com/$GITHUB_REPOSITORY && go test -v ./...
